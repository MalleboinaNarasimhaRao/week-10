<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JavaScript Functions</title>
</head>

<body>

    <h2>JavaScript Functions</h2>
    <div id="out"></div>

    <script>
        // Function Declaration
        function add(a, b) {
            return a + b;
        }

        // Function Expression
        const square = function (n) {
            return n * n;
        };

        // Arrow Function
        const greet = (name) => {
            return "Hello, " + name + "!";
        };

        // Display Output
        let msg = "add(5, 3) = " + add(5, 3) + "<br>";
        msg += "square(6) = " + square(6) + "<br>";
        msg += greet("Narasimha Rao");

        document.getElementById("out").innerHTML = msg;
    </script>

</body>

</html>
